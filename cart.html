<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Bag | Aetheria Luxury Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { 50: '#f4f6f8', 100: '#e1e7ec', 500: '#0f172a', 650: '#1e293b', 900: '#020617', accent: '#d97706', accentHover: '#b45309' } } } } }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen flex flex-col justify-between">
    <header class="sticky top-0 z-40 glass-nav border-b border-gray-200 dark:border-gray-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-20">
            <a href="index.html" class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-900 to-brand-accent flex items-center justify-center text-white shadow-lg"><i class="fa-solid fa-gem text-lg"></i></div>
                <span class="text-2xl font-bold tracking-tight bg-gradient-to-r from-brand-900 to-brand-accent dark:from-white dark:to-brand-accent bg-clip-text text-transparent">AETHERIA</span>
            </a>
            <nav class="hidden md:flex items-center space-x-8 font-medium text-sm">
                <a href="index.html" class="hover:text-brand-accent transition py-2">Home</a>
                <a href="products.html" class="hover:text-brand-accent transition py-2">Products</a>
                <a href="about.html" class="hover:text-brand-accent transition py-2">About Us</a>
                <a href="contact.html" class="hover:text-brand-accent transition py-2">Contact</a>
            </nav>
            <div class="flex items-center space-x-4">
                <button id="theme-toggle" onclick="toggleDarkMode()" class="p-2.5 rounded-full hover:bg-gray-200 dark:hover:bg-gray-800 transition"><i id="theme-icon" class="fa-solid fa-moon text-lg"></i></button>
                <a href="cart.html" class="relative p-2.5 rounded-full hover:bg-gray-200 dark:hover:bg-gray-800 transition"><i class="fa-solid fa-bag-shopping text-lg"></i><span id="cart-badge" class="absolute -top-1 -right-1 bg-brand-accent text-white text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center scale-0 transition-transform">0</span></a>
            </div>
        </div>
    </header>

    <main class="flex-grow animate-fade-in max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 space-y-10 w-full" id="cart-container">
        <!-- Injected via script -->
    </main>

    <footer class="bg-white dark:bg-brand-950 border-t border-gray-200 dark:border-gray-800 text-gray-600 dark:text-gray-400 pt-16 pb-12 mt-20">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-xs flex justify-between">
            <p>&copy; 2026 Aetheria Luxury Lifestyle Inc.</p>
            <a href="products.html">Continue Shopping</a>
        </div>
    </footer>
    <script src="script.js"></script>
    <script>
        function updateItemQty(productId, newQty) {
            if (newQty <= 0) {
                removeFromCartView(productId);
                return;
            }
            const item = cart.find(i => i.id === productId);
            if (item) {
                item.quantity = newQty;
                updateCartBadge();
                renderCartPage();
            }
        }

        function removeFromCartView(productId) {
            const item = cart.find(i => i.id === productId);
            cart = cart.filter(i => i.id !== productId);
            updateCartBadge();
            renderCartPage();
            if (item) showToast(`Removed "${item.name}" from your bag.`, 'info');
        }

        function renderCartPage() {
            const container = document.getElementById('cart-container');
            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const shipping = subtotal > 0 ? 25.00 : 0.00;
            const total = subtotal + (subtotal > 0 ? shipping : 0);

            if (cart.length === 0) {
                container.innerHTML = `
                    <div><span class="text-brand-accent font-semibold text-sm uppercase tracking-wider">Shopping Bag</span><h1 class="text-3xl font-bold text-brand-900 dark:text-white mt-1">Review Your Items</h1></div>
                    <div class="text-center py-24 bg-white dark:bg-brand-950 rounded-3xl border border-gray-200 dark:border-gray-800 space-y-6">
                        <div class="w-20 h-20 rounded-full bg-brand-accent/10 text-brand-accent flex items-center justify-center text-3xl mx-auto"><i class="fa-solid fa-bag-shopping"></i></div>
                        <div class="space-y-2"><h3 class="text-xl font-bold text-brand-900 dark:text-white">Your bag is currently empty</h3><p class="text-sm text-gray-500">Explore our luxury collection and discover exceptional artisanal goods.</p></div>
                        <a href="products.html" class="inline-block bg-brand-accent hover:bg-brand-accentHover text-white px-8 py-3.5 rounded-2xl font-semibold text-sm transition shadow-md">Start Shopping</a>
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <div><span class="text-brand-accent font-semibold text-sm uppercase tracking-wider">Shopping Bag</span><h1 class="text-3xl font-bold text-brand-900 dark:text-white mt-1">Review Your Items</h1></div>
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-10">
                        <div class="lg:col-span-2 space-y-4">
                            ${cart.map(item => `
                                <div class="bg-white dark:bg-brand-950 p-6 rounded-3xl border border-gray-200 dark:border-gray-800 shadow-sm flex flex-col sm:flex-row items-center justify-between gap-6">
                                    <div class="flex items-center space-x-4 w-full sm:w-auto">
                                        <img src="${item.image}" alt="${item.name}" class="w-20 h-20 rounded-2xl object-cover bg-gray-100 dark:bg-gray-900 shrink-0">
                                        <div><span class="text-xs text-gray-500">${item.category}</span><h3 class="font-semibold text-brand-900 dark:text-white text-base">${item.name}</h3><p class="text-brand-accent font-bold mt-1">$${item.price.toFixed(2)}</p></div>
                                    </div>
                                    <div class="flex items-center justify-between sm:justify-end w-full sm:w-auto space-x-6">
                                        <div class="flex items-center border border-gray-300 dark:border-gray-700 rounded-xl bg-gray-50 dark:bg-gray-900">
                                            <button onclick="updateItemQty(${item.id}, ${item.quantity - 1})" class="px-3 py-1.5 text-gray-500 hover:text-brand-accent font-bold">-</button>
                                            <span class="px-3 font-bold text-sm text-brand-900 dark:text-white">${item.quantity}</span>
                                            <button onclick="updateItemQty(${item.id}, ${item.quantity + 1})" class="px-3 py-1.5 text-gray-500 hover:text-brand-accent font-bold">+</button>
                                        </div>
                                        <button onclick="removeFromCartView(${item.id})" class="text-gray-400 hover:text-rose-600 transition p-2"><i class="fa-solid fa-trash-can text-lg"></i></button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                        <div class="bg-white dark:bg-brand-950 p-8 rounded-3xl border border-gray-200 dark:border-gray-800 shadow-sm space-y-6 h-fit">
                            <h3 class="font-bold text-brand-900 dark:text-white text-lg">Order Summary</h3>
                            <div class="space-y-4 text-sm text-gray-600 dark:text-gray-400 border-b border-gray-200 dark:border-gray-800 pb-6">
                                <div class="flex justify-between"><span>Subtotal</span><span class="font-semibold text-brand-900 dark:text-white">$${subtotal.toFixed(2)}</span></div>
                                <div class="flex justify-between"><span>Estimated Shipping</span><span class="font-semibold text-brand-900 dark:text-white">$${shipping.toFixed(2)}</span></div>
                            </div>
                            <div class="flex justify-between text-base font-bold text-brand-900 dark:text-white"><span>Total</span><span class="text-xl text-brand-accent">$${total.toFixed(2)}</span></div>
                            <a href="checkout.html" class="block w-full text-center bg-brand-accent hover:bg-brand-accentHover text-white py-4 rounded-2xl font-semibold text-base transition shadow-lg">Proceed to Checkout</a>
                        </div>
                    </div>
                `;
            }
        }
        document.addEventListener('DOMContentLoaded', renderCartPage);
    </script>
</body>
</html>
